name: Debug Unit Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  debug-unit-tests:
    name: Debug build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/azurelinux/base/core:3.0
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: "2"

    steps:
      - name: Install checkout dependencies
        run: |
          set -euo pipefail
          gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
          tdnf -y update
          tdnf -y install ca-certificates git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-ci-dependencies

      - name: Report runner resources
        run: |
          nproc
          free -h
          df -h .

      - name: Configure Debug
        run: |
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DBUILD_UNIT_TESTS=ON

      - name: Build Debug
        run: ninja -C build -j2 -l4

      - name: Run unit tests
        working-directory: build
        run: ./tests.sh --output-on-failure --no-tests=error --output-junit unit-tests.xml -L unit -j4

      - name: Upload diagnostic logs
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-unit-test-logs
          path: |
            build/Testing/Temporary/
            build/unit-tests.xml
            build/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
          if-no-files-found: ignore
